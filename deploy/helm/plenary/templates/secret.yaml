{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plenary.secretName" . }}
  labels:
    {{- include "plenary.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.cookieKey }}
  COOKIE_KEY: {{ .Values.secrets.cookieKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sessionKey }}
  SESSION_KEY: {{ .Values.secrets.sessionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.metricsToken }}
  PLENARY_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if eq .Values.mode "ha" }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.natsUrl }}
  NATS_URL: {{ .Values.secrets.natsUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SessionToken }}
  S3_SESSION_TOKEN: {{ .Values.secrets.s3SessionToken | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.oidcClientId }}
  OIDC_CLIENT_ID: {{ .Values.secrets.oidcClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
{{- end }}
