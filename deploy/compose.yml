# Plenary local stack: one single-node server (server/main.js). Run from the repo root:
#   docker compose -f deploy/compose.yml up --build
# Values come from your shell or deploy/.env (git-ignored; Compose reads .env beside this file); none are
# written here.

# Fixed project name, so the volume is always `plenary_plenary-data` whatever the directory is called.
name: plenary

services:
  plenary:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: plenary:dev
    # Published on the host's loopback only. Inside the container the server listens on 0.0.0.0 (HOST in the
    # Dockerfile).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      PLENARY_DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dev tokens, for local use only: JSON mapping token to user. Empty = off, and every hello is refused
      # (sign-in is not wired into server/main.js yet). See deploy/README.md.
      PLENARY_DEV_TOKENS: ${PLENARY_DEV_TOKENS:-}
      # Optional, at least 32 bytes (`openssl rand -hex 32`). Signs sign-in cookies and sessions. Unset = a random key
      # per start, so every restart signs everyone out; set it in deploy/.env for anything you keep running.
      # No value here on purpose: Compose passes it from your shell or deploy/.env, and leaves it unset otherwise
      # (an empty string would be refused by main.js as too short).
      COOKIE_KEY:
      # Google sign-in: server/main.js does not read these yet. Uncomment when it does; values from env only.
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Cluster adapters (phase 4); empty means single node (SQLite, in-memory bus, local disk).
      # DATABASE_URL: ${DATABASE_URL:-}
      # NATS_URL: ${NATS_URL:-}
    volumes:
      - plenary-data:/data
    restart: unless-stopped

  # phase 4: Postgres store for the cluster adapter.
  # postgres:
  #   image: postgres:17
  #   environment:
  #     POSTGRES_USER: plenary
  #     POSTGRES_DB: plenary
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #   ports:
  #     - "127.0.0.1:5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

  # phase 4: NATS bus for the cluster adapter.
  # nats:
  #   image: nats:2
  #   command: ["-js"]
  #   ports:
  #     - "127.0.0.1:4222:4222"

volumes:
  plenary-data:
  # postgres-data:   # phase 4
