# NATS core for the phase-4 cluster stack (deploy/cluster.compose.yml). No JetStream: PROTOCOL.md uses NATS core.
# One server, no clustering, no auth: it is reachable only inside the Compose network (no published port).

port: 4222

# HTTP monitoring, used by the Compose healthcheck (GET /healthz). Not published.
http_port: 8222

# PROTOCOL.md: "A deployment's bus must carry 2 MB messages (NATS: raise max_payload)". The default is 1 MB.
max_payload: 2MB
