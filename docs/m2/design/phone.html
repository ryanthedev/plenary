<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plenary · phone frames</title>
<style>
  body { margin: 0; background: #e9e9ee; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1b1b1f; }
  @media (prefers-color-scheme: dark) { body { background: #111114; color: #e9ecef; } a { color: #a8a5ff; } }
  header { padding: 14px 20px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .row { display: flex; gap: 24px; padding: 0 20px 24px; overflow-x: auto; }
  figure { margin: 0; }
  figcaption { font-size: 12px; margin-bottom: 6px; opacity: .75; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.25); background: #fff; display: block; }
  body.bare header, body.bare figcaption { display: none; }
  body.bare .row { padding: 0; }
  body.bare .row { justify-content: center; overflow: hidden; }
  body.bare iframe { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<header><b>Touch layout at 390 px</b> <a href="index.html">← back to the mock</a> <span>Each frame is the real mock in a 390 px iframe; use its MOCK bar to change state.</span></header>
<div class="row" id="row"></div>
<script>
  // ?bare=1&q=<query for index.html> shows one borderless frame (used by shoot.sh).
  const p = new URLSearchParams(location.search), row = document.getElementById("row");
  const frames = p.get("bare") ? [["", p.get("q") ?? ""]] : [
    ["Presenter", "role=presenter"], ["Presenter · style sheet", "sheet=panel"], ["Annotator", "role=annotator"],
    ["Annotator · notes", "role=annotator&sheet=notes"], ["Viewer · dark", "role=viewer&theme=dark"],
  ];
  if (p.get("bare")) document.body.classList.add("bare");
  for (const [cap, q] of frames) {
    // Built with DOM calls, never innerHTML: q comes from the URL.
    const f = document.createElement("figure"), fc = document.createElement("figcaption"), fr = document.createElement("iframe");
    fc.textContent = cap;
    fr.setAttribute("title", cap || "phone");
    fr.src = "index.html?" + new URLSearchParams(q).toString();
    f.append(fc, fr);
    row.appendChild(f);
  }
</script>
</body>
</html>
