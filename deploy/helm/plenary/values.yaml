# Default values for Plenary Helm Chart.
#
# Two deployment modes are supported:
#   1. mode: "single" (default) — Simple Single-Node: SQLite + local disk blobs on a RWO PVC,
#      replicaCount: 1, Recreate deployment strategy.
#   2. mode: "ha" — Enterprise HA: shared Postgres + NATS (max_payload >= 2MB) + S3-compatible blobs,
#      replicaCount: 3, RollingUpdate strategy, PodDisruptionBudget enabled.

# Deployment mode: "single" or "ha"
mode: "single"

# Number of Plenary pods.
# Leave null to use mode defaults: 1 in "single" mode, 3 in "ha" mode.
# In "single" mode this MUST NOT exceed 1 (SQLite does not support multi-pod concurrent writers).
replicaCount: null

image:
  repository: ghcr.io/ryanthedev/plenary
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Non-root pod security context matching deploy/Dockerfile (USER 1000:1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Hardened container security context: read-only root filesystem, no privilege escalation, all capabilities dropped.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations:
    # For ingress-nginx WebSocket support:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: plenary.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: plenary-tls
  #    hosts:
  #      - plenary.example.com

# Resource requests and limits (production baseline).
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# HTTP probes against Plenary's built-in GET /health endpoint.
probes:
  startup:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 20
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30

# Persistent storage for Simple Single-Node mode (SQLite plenary.db, registry.db, and local blobs).
# Ignored in "ha" mode (where an emptyDir is mounted at /data for ephemeral scratch).
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}
  existingClaim: ""

# PodDisruptionBudget (automatically rendered in "ha" mode when enabled).
podDisruptionBudget:
  enabled: true
  minAvailable: 2
  # maxUnavailable: 1

# Application configuration (non-secret environment variables read by server/main.js).
config:
  logLevel: "info"
  publicUrl: ""
  postLoginUrl: ""
  boardUrl: ""
  requestDeadlineMs: "8000"
  maxConnsPerUser: "64"
  trashSweepMs: "600000"
  blobReapMs: "600000"
  blobQuotaBytes: ""

  # Cluster-specific non-secret settings (used when mode == "ha").
  roles: "gateway,host"
  leaseTtlMs: "10000"

  # Blob storage settings (required in "ha" mode unless blobsMode is "local-disk").
  # Set blobsMode: "local-disk" ONLY for a single-gateway cluster.
  blobsMode: ""
  s3:
    endpoint: ""
    bucket: "plenary"
    region: "us-east-1"

  # Authentication — pick ONE of OIDC or Google Workspace SSO (mutually exclusive).
  oidc:
    issuerUrl: ""
    redirectUri: ""
    scopes: ""
    displayName: ""
    tenantSlug: ""
    tenantDomain: ""
    emailDomains: ""
    allowedGroups: ""
    groupsClaim: ""
    adminUsers: ""
    allowUnverifiedEmail: false

# Secrets management.
# Production recommendation: manage secrets externally (ExternalSecrets, SealedSecrets, Vault)
# and pass `secrets.existingSecret` naming a Kubernetes Secret with the keys below:
#   COOKIE_KEY, SESSION_KEY, PLENARY_METRICS_TOKEN,
#   DATABASE_URL, NATS_URL,
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_SESSION_TOKEN,
#   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#
# Never commit real secret values to values.yaml.
secrets:
  existingSecret: ""
  cookieKey: ""
  sessionKey: ""
  metricsToken: ""
  databaseUrl: ""
  natsUrl: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""
  s3SessionToken: ""
  oidcClientId: ""
  oidcClientSecret: ""
  googleClientId: ""
  googleClientSecret: ""

# Extra environment variables passed verbatim to the container.
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
