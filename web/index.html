<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Plenary</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="adapters/dom/collab/collab.css">
</head>
<body>
<!-- Plenary canvas (production): web/main.js over the server's /ws. URL: ?board=<id>&theme=light|dark, and
     #code=<single-use code> after sign-in. The in-browser dev rooms live on web/dev-main.html (never served). -->
<div class="app">
  <h1 class="sr-only">Plenary</h1>
  <header class="topbar" id="topbar"></header>
  <div class="main">
    <aside class="drawer" id="drawer" hidden></aside>
    <div class="canvas" id="canvas">
      <canvas class="board" id="board" tabindex="0" aria-label="Board"></canvas>
      <textarea class="ink" id="ink" spellcheck="false" aria-label="Text"></textarea>
      <div class="offline-veil" id="veil" hidden></div>
      <div id="overlays"></div>
      <div class="toast" id="toast" hidden></div>
      <div class="hud hud-bl" id="hudBL"></div>
      <div class="hud hud-bc" id="hudBC"></div>
      <div class="hud hud-br" id="hudBR"></div>
      <div class="dock" id="dock"></div>
    </div>
    <aside class="panel" id="panel" hidden></aside>
    <div class="sheet" id="sheet" hidden></div>
    <div id="dialogs"></div>
  </div>
  <footer class="timeline" id="timeline" hidden></footer>
</div>
<input type="file" id="picker" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime,.excalidrawlib" multiple hidden>
<script type="module" src="main.js"></script>
</body>
</html>
