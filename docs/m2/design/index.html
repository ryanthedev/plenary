<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plenary · design mock (M2 phases 6–7)</title>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div class="app">

  <!-- Mock controls: NOT part of the product. Every state is also a URL parameter (see README.md). -->
  <div class="mockbar" id="mockbar">
    <b>MOCK</b>
    <label>role <select data-k="role"><option>presenter</option><option>annotator</option><option>viewer</option></select></label>
    <label>theme <select data-k="theme"><option>light</option><option>dark</option></select></label>
    <label>connection <select data-k="conn"><option>connected</option><option>reconnecting</option><option>offline</option><option value="readonly">read-only</option></select></label>
    <label>panel <select data-k="panel"><option>stack</option><option>tabs</option><option>closed</option></select></label>
    <label>open <select data-k="open">
      <option value="">nothing</option><option value="thread">comment on element</option><option value="point">comment on a point</option>
      <option value="resolved">resolved comment</option><option value="emote">more emotes</option><option value="mermaid">Mermaid import</option>
      <option value="export">export</option></select></label>
    <label>drawer <select data-k="drawer"><option value="">closed</option><option value="notes">notes</option><option value="comments">comments</option></select></label>
    <label class="phone-only">sheet <select data-k="sheet"><option value="">closed</option><option value="panel">style</option><option value="tools">all tools</option><option value="notes">notes</option><option value="comments">comments</option></select></label>
    <label><input type="checkbox" data-k="src"> show sources</label>
    <a href="legend.html">legend &amp; roles →</a>
    <a href="phone.html" class="desk-only">phone frame →</a>
  </div>

  <header class="topbar" id="topbar"></header>

  <div class="main">
    <aside class="drawer" id="drawer"></aside>

    <div class="canvas" id="canvas">
      <svg class="world" id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Board">
        <defs>
          <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
            <path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker>
          <marker id="headInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0 1 L9 5 L0 9" fill="none" class="w-ink" style="stroke-width:1.6"/></marker>
          <marker id="headBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0 1 L9 5 L0 9" fill="none" stroke="#1971c2" stroke-width="1.6"/></marker>
          <linearGradient id="laserFade" x1="0" x2="1"><stop offset="0" stop-color="#ff3b30" stop-opacity="0"/><stop offset="1" stop-color="#ff3b30" stop-opacity="1"/></linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>
        <g id="world">
          <!-- ═══ board stream (presenters) ═══ -->
          <!-- frame 1 -->
          <text class="w-frame-name" x="40" y="52">1 · Q4 at a glance</text>
          <rect class="w-frame" x="40" y="60" width="640" height="420"/>
          <text class="w-txt" x="70" y="116" font-size="30" font-weight="650">Q4 at a glance</text>
          <path d="M72 128 C 130 136, 190 124, 250 131 S 330 126, 352 130" stroke="#1971c2" stroke-width="3" fill="none" stroke-linecap="round"/>

          <rect class="w-ink" x="70" y="150" width="170" height="100" rx="10" fill="#b2f2bb"/>
          <text class="w-lbl" x="155" y="190" text-anchor="middle" font-size="16">Revenue</text>
          <text class="w-lbl" x="155" y="222" text-anchor="middle" font-size="26" font-weight="700">+18%</text>

          <rect class="w-ink" x="260" y="150" width="170" height="100" rx="10" fill="#a5d8ff"/>
          <text class="w-lbl" x="345" y="190" text-anchor="middle" font-size="16">NPS</text>
          <text class="w-lbl" x="345" y="222" text-anchor="middle" font-size="26" font-weight="700">61</text>

          <rect class="w-ink" x="450" y="150" width="200" height="100" rx="10" fill="#ffec99"/>
          <text class="w-lbl" x="550" y="190" text-anchor="middle" font-size="16">Uptime</text>
          <text class="w-lbl" x="550" y="222" text-anchor="middle" font-size="26" font-weight="700">99.98%</text>

          <!-- an image element (a picture dropped on the board: a bitmap, so it looks the same in dark mode) -->
          <g>
            <rect x="70" y="290" width="330" height="160" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
            <text x="86" y="312" font-size="12" fill="#495057" font-family="var(--font)">Revenue by month ($M)</text>
            <line x1="86" y1="432" x2="386" y2="432" stroke="#adb5bd"/>
            <g fill="#4c6ef5"><rect x="96" y="388" width="22" height="44"/><rect x="128" y="380" width="22" height="52"/><rect x="160" y="372" width="22" height="60"/>
              <rect x="192" y="376" width="22" height="56"/><rect x="224" y="360" width="22" height="72"/><rect x="256" y="352" width="22" height="80"/>
              <rect x="288" y="340" width="22" height="92"/><rect x="320" y="334" width="22" height="98"/></g>
            <g fill="#12b886"><rect x="352" y="322" width="22" height="110"/></g>
          </g>

          <ellipse cx="545" cy="362" rx="102" ry="58" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
          <text x="545" y="368" text-anchor="middle" font-size="17" fill="#e03131" font-family="var(--font)">3 new regions</text>

          <!-- frame 2: a Mermaid import (importMermaid), elbow arrows -->
          <text class="w-frame-name" x="720" y="52">2 · Launch flow</text>
          <rect class="w-frame" x="720" y="60" width="780" height="420"/>
          <text class="w-txt" x="750" y="116" font-size="30" font-weight="650">Launch flow</text>

          <rect class="w-ink" x="750" y="220" width="110" height="60" rx="8"/>
          <text class="w-txt" x="805" y="256" text-anchor="middle" font-size="16">Idea</text>
          <rect class="w-ink" x="905" y="220" width="110" height="60" rx="8"/>
          <text class="w-txt" x="960" y="256" text-anchor="middle" font-size="16">Spec</text>
          <path class="w-ink" d="M1110 200 L1180 250 L1110 300 L1040 250 Z" fill="#eebefa"/>
          <text class="w-lbl" x="1110" y="256" text-anchor="middle" font-size="16">Review?</text>
          <rect class="w-ink" x="1260" y="160" width="120" height="60" rx="8"/>
          <text class="w-txt" x="1320" y="196" text-anchor="middle" font-size="16">Build</text>
          <rect class="w-ink" x="1260" y="300" width="120" height="60" rx="8" fill="#b2f2bb"/>
          <text class="w-lbl" x="1320" y="336" text-anchor="middle" font-size="16">Ship</text>

          <path class="w-ink" d="M860 250 H903" marker-end="url(#headInk)"/>
          <path class="w-ink" d="M1015 250 H1038" marker-end="url(#headInk)"/>
          <path class="w-ink" d="M1110 200 V190 H1258" marker-end="url(#headInk)"/>
          <text class="w-txt" x="1180" y="182" font-size="13">yes</text>
          <path class="w-ink" d="M1110 300 V340 H960 V282" marker-end="url(#headInk)"/>
          <text class="w-txt" x="1050" y="358" font-size="13">no</text>
          <path class="w-ink" d="M1320 220 V298" marker-end="url(#headInk)"/>

          <!-- Maya's pen stroke, still being drawn: a preview (v0 `transient` op; v1 draft `preview` presence) -->
          <path id="liveStroke" d="M760 420 C 785 400, 805 440, 830 420 S 875 400, 900 420 S 940 440, 962 418" stroke="#e03131" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- ═══ notes stream (annotators) ═══ -->
          <g id="notes">
            <path d="M100 222 H212" stroke="#ffd43b" stroke-width="20" stroke-linecap="round" opacity=".5"/>
            <rect class="w-ink" x="60" y="530" width="190" height="96" fill="#ffec99" style="stroke-width:1"/>
            <text class="w-lbl" x="74" y="562" font-size="14">Can we see Q3 next</text><text class="w-lbl" x="74" y="582" font-size="14">to Q4?</text>
            <rect class="w-ink" x="270" y="545" width="190" height="96" fill="#ffec99" style="stroke-width:1"/>
            <text class="w-lbl" x="284" y="577" font-size="14">Which 3 regions?</text>
            <path d="M370 545 Q 410 480 455 412" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#headBlue)"/>
            <rect class="w-ink" x="480" y="530" width="190" height="96" fill="#ffc9c9" style="stroke-width:1"/>
            <text class="w-lbl" x="494" y="562" font-size="14">Hiring plan for the</text><text class="w-lbl" x="494" y="582" font-size="14">new regions?</text>
            <rect class="w-ink" x="980" y="512" width="170" height="80" fill="#b2f2bb" style="stroke-width:1"/>
            <text class="w-lbl" x="994" y="544" font-size="14">🎉 Ship it!</text>
          </g>

          <!-- ═══ presence (never saved) ═══ -->
          <g id="laser">
            <path d="M432 330 C 450 290, 520 288, 580 296 S 668 340, 640 392 S 560 430, 500 418" stroke="#ff3b30" stroke-width="10" fill="none" stroke-linecap="round" opacity=".35" filter="url(#glow)"/>
            <path d="M432 330 C 450 290, 520 288, 580 296 S 668 340, 640 392 S 560 430, 500 418" stroke="url(#laserFade)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>
          <g id="remoteSel">
            <rect x="1032" y="194" width="156" height="112" fill="none" stroke="var(--u-dev)" stroke-width="2" stroke-dasharray="6 4"/>
          </g>
          <g id="localSel"></g>
        </g>
      </svg>
      <div class="offline-veil" id="veil" hidden></div>
      <div id="overlays"></div>
      <div class="hud hud-bl" id="hudBL"></div>
      <div class="hud hud-bc" id="hudBC"></div>
      <div class="hud hud-br" id="hudBR"></div>
      <div class="dock" id="dock"></div>
    </div>

    <aside class="panel" id="panel"></aside>
    <div class="sheet" id="sheet" hidden></div>
    <div id="dialogs"></div>
  </div>

  <footer class="timeline" id="timeline"></footer>
</div>
<script src="mock.js"></script>
</body>
</html>
