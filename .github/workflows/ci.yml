# CI: two jobs, no overlap. `test` runs the whole suite with no services (cluster-gated tests skip there).
# `test-cluster-services` runs only the cluster-gated files (scripts/cluster-files.json, the list `bun run test:cluster`
# also uses) against Postgres, NATS and MinIO. Both go through scripts/ci-test.js: JUnit report (uploaded), a rerun of
# only the failed files once, and a job summary naming each failure FLAKY (passed on rerun) or FAILING (failed twice).
# The job fails either way; a rerun is a diagnosis, never a pass.
# No secrets, no registry login, no deploy step. Nothing is published from here.
# core-source drift against upstream herdr-draw runs weekly in herdr-drift.yml, not here.
name: ci

on:
  push:
    branches: [main, "plenary/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on pull requests only. On main a running run is never cancelled, but GitHub keeps
  # only one pending run per group: several quick pushes to main can still drop a run that had not started.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1 (SHA read with `git ls-remote` on 2026-11-11)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0 (SHA read with `git ls-remote` on 2026-11-11)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      # actions/cache v5.0.5 (SHA read with `git ls-remote` on 2026-11-18). Keyed on bun.lock: a changed lock misses.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # --frozen-lockfile fails the job if bun.lock does not match package.json (it never rewrites it) or is missing.
      - name: Install (bun.lock, frozen)
        timeout-minutes: 3
        run: bun install --frozen-lockfile

      - name: Test (whole suite, no services)
        timeout-minutes: 7
        run: bun scripts/ci-test.js

      # actions/upload-artifact v7.0.1 (SHA read with `git ls-remote` on 2026-11-18)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: junit-test
          path: test-results/
          if-no-files-found: warn

  # Only the cluster-gated files, with Postgres, NATS (2 MB max_payload) and an S3-compatible blob store beside them.
  # Any skipped test here fails the run: a gated test that skips means its service was not reachable.
  test-cluster-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: plenary
          POSTGRES_DB: plenary
          # Throwaway literal on purpose: this database lives only inside this CI job's service container, is
          # reachable only from the runner, and holds nothing. It is not a secret and is used nowhere else.
          POSTGRES_PASSWORD: plenary-ci-only
        ports:
          - 5432:5432
        # GitHub waits for this health check before the first step runs.
        options: >-
          --health-cmd "pg_isready -U plenary -d plenary"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    # NATS and MinIO are `docker run` steps, not service containers: NATS takes max_payload only from a config file
    # (deploy/cluster/nats.conf), and service containers start before checkout, so they cannot mount it.
    env:
      DATABASE_URL: postgres://plenary:plenary-ci-only@127.0.0.1:5432/plenary
      NATS_URL: nats://127.0.0.1:4222
      # Every S3_* value is a THROWAWAY CI-ONLY literal: the store lives only inside this job's container, is
      # published only on the runner's loopback, holds nothing, and these values are used nowhere else. Not secrets.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: plenary-ci
      # MinIO accepts any region name; us-east-1 matches cluster.compose.yml.
      S3_REGION: us-east-1
      # Also the store's root user (MinIO wants at least 3 characters).
      S3_ACCESS_KEY_ID: plenary-ci-only
      # Also the store's root password (MinIO wants at least 8 characters).
      S3_SECRET_ACCESS_KEY: plenary-ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install (bun.lock, frozen)
        timeout-minutes: 3
        run: bun install --frozen-lockfile

      # Both containers start first, then each is waited on through Docker's own health check (the image's own
      # health command, retried by the daemon every second), so the two start up in parallel. Plain `docker run`:
      # anonymous pull of a pinned public image, no login, loopback only. No --rm, so `docker logs` works after a crash.
      - name: Start NATS (max_payload 2 MB) and blob store (pgsty/minio)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          docker pull -q nats:2.15.3-alpine & docker pull -q pgsty/minio:RELEASE.2026-08-04T00-00-00Z & wait
          docker run -d --name nats -p 127.0.0.1:4222:4222 \
            -v "$GITHUB_WORKSPACE/deploy/cluster/nats.conf:/etc/nats/plenary.conf:ro" \
            --health-cmd "wget -q -O /dev/null http://127.0.0.1:8222/healthz" --health-interval 1s --health-timeout 3s --health-retries 60 \
            nats:2.15.3-alpine nats-server --config /etc/nats/plenary.conf
          # The same pinned image as deploy/cluster.compose.yml. /minio/health/cluster, not /ready: /ready answers 200
          # before MinIO accepts bucket operations.
          docker run -d --name blobs -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            --health-cmd "curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/cluster" --health-interval 1s --health-timeout 3s --health-retries 60 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z minio server /data
          for c in nats blobs; do
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = healthy ]; do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = unhealthy ] || [ "$(docker inspect -f '{{.State.Running}}' "$c")" != true ]; then
                echo "$c did not become healthy." >&2; docker logs "$c" >&2 || true; exit 1
              fi
              sleep 0.5
            done
          done
          # Capture first, then grep: piping into `grep -q` under pipefail can fail falsely (SIGPIPE).
          varz="$(docker exec nats wget -q -O - http://127.0.0.1:8222/varz)"
          grep -Eq '"max_payload": *2097152\b' <<<"$varz" || { echo "NATS max_payload is not 2097152." >&2; grep max_payload <<<"$varz" >&2 || true; exit 1; }
          # mc (the image's MinIO client) runs inside the container. The cluster is healthy, so these must succeed first time.
          docker exec blobs mc alias set ci http://127.0.0.1:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" >/dev/null
          docker exec blobs mc mb --ignore-existing "ci/$S3_BUCKET" >/dev/null
          docker exec blobs mc stat "ci/$S3_BUCKET" >/dev/null
          echo "NATS up (max_payload 2097152); blob store up, bucket $S3_BUCKET exists."

      # server/main.js refuses cluster mode (DATABASE_URL or NATS_URL set) without COOKIE_KEY. A fresh random key per
      # run, masked in the log; never a literal here.
      - name: Generate a throwaway COOKIE_KEY
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "COOKIE_KEY=$key" >> "$GITHUB_ENV"

      - name: Test (cluster-gated files only)
        timeout-minutes: 6
        run: bun scripts/ci-test.js --cluster

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: junit-cluster
          path: test-results/
          if-no-files-found: warn

      - name: Service logs
        if: failure()
        run: for c in nats blobs; do echo "::group::$c"; docker logs "$c" 2>&1 | tail -100 || true; echo "::endgroup::"; done
