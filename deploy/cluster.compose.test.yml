# Test override for deploy/cluster.compose.yml, used only by `bun run test:compose` (scripts/test-compose.js). Never
# for real use. Layered on top of the cluster file: `-f deploy/cluster.compose.yml -f deploy/cluster.compose.test.yml`.
#
# What it changes, and why:
#  - Every app node has BOTH roles (gateway,host). The takeover check needs a second host to take over a killed one, and
#    the three-node shape of the cluster file has one host (app-3). The test connects clients to the nodes directly, so
#    the `lb` service is not started (the script names the services it starts).
#  - restart: "no". A SIGKILLed node must stay dead until the test restarts it; the runtime must not do it first.
#  - Each app node and the Postgres service publish a random free port on 127.0.0.1 (the script reads them with
#    `compose port`), so no fixed host port can collide with anything.
#  - PLENARY_LEASE_TTL_MS 3000 (the cluster file's default is 10000): a killed host's lease lapses in at most 3 s, so
#    takeover is fast. The ttl must be identical on every node (set once, on all three, here).
#  - CPU and memory limits, so the stack cannot starve a busy machine.
# PLENARY_DEV_TOKENS comes from the script's environment (dev tokens that exist only for this run).

x-test-app: &test-app
  restart: "no"
  ports:
    - "127.0.0.1::8080"
  cpus: 0.75
  mem_limit: 384m

x-test-env: &test-env
  PLENARY_ROLES: gateway,host
  PLENARY_LEASE_TTL_MS: "3000"

services:
  postgres:
    ports:
      - "127.0.0.1::5432"
    cpus: 1.0
    mem_limit: 512m
  nats:
    cpus: 0.5
    mem_limit: 128m
  blobs:
    cpus: 0.5
    mem_limit: 256m
  app-1:
    <<: *test-app
    environment: *test-env
  app-2:
    <<: *test-app
    environment: *test-env
  app-3:
    <<: *test-app
    environment: *test-env
